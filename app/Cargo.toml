[package]
name = "retal"
version = "0.1.0"
edition = "2021"
default-run = "retal"

[[bin]]
name = "retal"
path = "src/main.rs"

# Match server for online play (also serves the browser game).
[[bin]]
name = "retal-server"
path = "src/bin/retal-server.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
