# Example GitHub Actions workflow that publishes app/public-html to GitHub Pages.
# To use it: copy this file to .github/workflows/pages.yml at the top of your repository,
# then in the repository settings choose Pages -> Source: "GitHub Actions".
# (If the game lives somewhere other than app/, change the path below.)
name: Publish Retal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/public-html
      - id: deployment
        uses: actions/deploy-pages@v4
