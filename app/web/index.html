<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Retal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1a3a">
    <meta name="apple-mobile-web-app-title" content="Retal">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #0b1a3a;
            touch-action: none; overscroll-behavior: none;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        }
        /* keep the game clear of phone notches and rounded corners */
        canvas {
            margin: 0; padding: 0; position: absolute;
            left: env(safe-area-inset-left, 0px);
            top: env(safe-area-inset-top, 0px);
            width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            background: #0b1a3a; touch-action: none; outline: none;
        }
        #start {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(4, 10, 24, 0.86); color: #bfffcf;
            font: 600 18px/1.5 ui-monospace, Menlo, Consolas, monospace; text-align: center;
            cursor: pointer;
        }
        #start h1 { color: #ffd65a; font-size: 34px; margin: 0 0 8px; letter-spacing: 3px; }
        #start .go {
            margin-top: 22px; padding: 14px 34px; border: 2px solid #5dff7a; border-radius: 10px;
            color: #fff; font-size: 22px; background: rgba(40, 140, 60, 0.35);
        }
        #start small { opacity: 0.75; max-width: 520px; padding: 0 18px; }
        #rotate {
            display: none; position: absolute; inset: 0; z-index: 20;
            align-items: center; justify-content: center; flex-direction: column;
            background: rgba(4, 10, 24, 0.92); color: #ffd65a;
            font: 600 20px/1.5 ui-monospace, Menlo, Consolas, monospace; text-align: center;
        }
        @media (orientation: portrait) and (pointer: coarse) {
            #rotate.armed { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="start">
        <h1>RETAL</h1>
        <div>Endless arcade air combat</div>
        <small id="hint">Keyboard: arrows/WASD fly, Space gun, Enter missile.<br>Phone: hold it sideways, tilt to fly, tap GUN / MSL to shoot.<br>Tip: "Add to Home Screen" plays full screen.</small>
        <div class="go">TAP / CLICK TO START</div>
    </div>
    <div id="rotate">&#8635;<br>Turn your phone sideways<br><small>(landscape plays best)</small></div>

    <script>var RETAL_SERVER = "";</script>
    <script src="config.js" onerror="void 0"></script>
    <script src="mq_js_bundle.js"></script>
    <script src="tilt.js"></script>
    <script src="net.js"></script>
    <script>
        var started = false;
        var startEl = document.getElementById("start");
        function begin(ev) {
            if (started) { return; }
            started = true;
            if (ev) { ev.preventDefault(); }
            // Ask for the motion sensor (iPhone needs this tap), go full screen and lock landscape where allowed.
            retalRequestTilt();
            if (retalTilt.isTouch) {
                retalKeepAwake();
                var el = document.documentElement;
                var fs = el.requestFullscreen || el.webkitRequestFullscreen;
                if (fs) {
                    try {
                        var p = fs.call(el);
                        if (p && p.then) {
                            p.then(function () {
                                if (screen.orientation && screen.orientation.lock) {
                                    screen.orientation.lock("landscape").catch(function () {});
                                }
                            }).catch(function () {});
                        }
                    } catch (e) { /* not available */ }
                }
                document.getElementById("rotate").classList.add("armed");
            }
            startEl.style.display = "none";
            document.getElementById("glcanvas").focus();
        }
        startEl.addEventListener("click", begin);
        startEl.addEventListener("touchend", begin);
        document.addEventListener("keydown", function (e) { if (!started) { begin(e); } });
        // keep the page from scrolling or zooming while playing
        document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        document.addEventListener("dblclick", function (e) { e.preventDefault(); });
        if (location.hash === "#play") { begin(null); }
        load("retal.wasm");
    </script>
</body>
</html>
